
<!DOCTYPE html>
<html lang="es">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sangre Carbayona - Puzzle Carbayón V4</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>SANGRE CARBAYONA <span style="opacity:.6;font-weight:400">|</span> PUZZLE CARBAYÓN</h1>
      <small>ROMPECABEZAS CLÁSICOS • PESTAÑA REDONDA GORDA • REAL OVIEDO</small>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="pill" id="diffLabel"></span>
      <span class="pill" id="placedCount"></span>
    </div>
  </header>

  <div class="controls">
    <select id="diffSelect">
      <option value="easy">Fácil - 12 piezas</option>
      <option value="medium">Medio - 35 piezas</option>
      <option value="hard">Difícil - 80 piezas</option>
      <option value="legend">Leyenda - 140 piezas</option>
    </select>
    <select id="levelSelect"></select>
    <button id="previewBtn">👁️ Preview (mantén)</button>
    <button id="restartBtn">↻ Reiniciar</button>
    <span class="pill">⏱️ <span id="time">00:00</span></span>
    <span class="pill">📊 <span id="progress">0%</span></span>
    <span style="font-size:11px;opacity:.6" id="levelTitle"></span>
  </div>

  <div id="boardWrap">
    <div id="board">
      <div id="previewOverlay" class="preview-overlay"><img id="previewImg" src="" alt="preview"></div>
    </div>
  </div>

  <div id="trayWrap">
    <div id="trayHeader">
      <span>BANDEJA • ARRASTRA FONDO PARA MOVER • <span id="trayCount">0 piezas</span></span>
      <div class="tray-nav">
        <button id="trayLeft" title="Izquierda">◀</button>
        <button id="trayRight" title="Derecha">▶</button>
        <span style="font-size:10px;opacity:.7;margin-left:6px">scroll visible azul abajo</span>
      </div>
    </div>
    <div id="tray"></div>
  </div>

  <div id="winModal" class="hidden">
    <div class="modal">
      <div style="width:48px;height:48px;background:#0a3d8f;color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto;font-size:22px">🏆</div>
      <h2>¡PUZZLE COMPLETADO!</h2>
      <p id="winStats" style="font-size:13px;line-height:1.5;color:#6b5e4a"></p>
      <img id="winThumb" src="" alt="completado">
      <div class="actions">
        <button id="nextBtn" class="primary" style="height:44px;border-radius:999px;background:#0a3d8f;color:white;border:1px solid #0a3d8f;font-weight:700">Siguiente Nivel →</button>
        <button id="closeWinBtn" style="height:44px;border-radius:999px;background:#fff8e7;border:1px solid #e8dcc2;font-weight:700">Menú</button>
      </div>
      <div style="font-size:10px;letter-spacing:.18em;color:#b8aa8d;margin-top:12px">SANGRE CARBAYONA • PUZZLE CARBAYÓN V4 REDONDEADO</div>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script type="module">
    import { init } from './js/game.js';
    init();
  </script>
</body>
</html>
